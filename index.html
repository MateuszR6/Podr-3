<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Podróży z Trasami</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    #map {
      height: 500px;
      width: 100%;
      margin-top: 20px;
    }
    .controls, .filter {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 10px 0;
    }
    .controls select,
    .filter select,
    .controls input,
    .controls textarea {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
    }
    #placesList, #routesList {
      margin-top: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
      padding: 10px;
    }
    .place-item, .route-item {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
    .route-item {
      background-color: #eef;
    }
    .place-item img {
      max-width: 100%;
      height: auto;
      display: block;
      margin-top: 10px;
    }
    .place-item button, .route-item button, #routeForm button {
      margin-top: 10px;
      padding: 5px 10px;
      font-size: 14px;
    }
    #routeForm {
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 20px;
      border-radius: 5px;
      background-color: #fafafa;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <h1>Mapa Podróży</h1>
  <div class="controls">
    <select id="markerType">
      <option value="Jedzenie">Jedzenie</option>
      <option value="Nocleg">Nocleg</option>
      <option value="Atrakcja">Atrakcja</option>
    </select>
  </div>
  
  <div id="map"></div>
  
  <h2>Lista punktów</h2>
  <div class="filter">
    <label for="filterType">Filtruj według typu:</label>
    <select id="filterType">
      <option value="Wszystko">Wszystko</option>
      <option value="Jedzenie">Jedzenie</option>
      <option value="Nocleg">Nocleg</option>
      <option value="Atrakcja">Atrakcja</option>
    </select>
  </div>
  <div id="placesList"></div>
  
  <!-- Sekcja tworzenia trasy -->
  <h2>Tworzenie trasy</h2>
  <div id="routeForm">
    <div class="controls">
      <label for="startPoint">Punkt początkowy:</label>
      <select id="startPoint"></select>
      <label for="endPoint">Punkt końcowy:</label>
      <select id="endPoint"></select>
    </div>
    <div class="controls">
      <label for="routeLocation">Miejsce:</label>
      <input type="text" id="routeLocation" placeholder="Miejsce trasy">
    </div>
    <div class="controls">
      <label for="routeDate">Data:</label>
      <input type="date" id="routeDate">
    </div>
    <div class="controls">
      <label for="departureTime">Godzina odjazdu:</label>
      <input type="time" id="departureTime">
      <label for="arrivalTime">Godzina przyjazdu:</label>
      <input type="time" id="arrivalTime">
    </div>
    <div class="controls">
      <label for="routeDescription">Opis:</label>
      <textarea id="routeDescription" placeholder="Opis trasy"></textarea>
    </div>
    <button onclick="addRoute()">Dodaj trasę</button>
  </div>
  
  <h2>Lista tras</h2>
  <div id="routesList"></div>
  
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([52.2, 21.0], 6);
    const markerColors = {
      Jedzenie: 'red',
      Nocleg: 'blue',
      Atrakcja: 'green'
    };

    // Wczytanie markerów i tras z LocalStorage
    const markers = loadMarkers();
    let routes = loadRoutes();

    const placesList = document.getElementById('placesList');
    const filterType = document.getElementById('filterType');

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Przywracanie markerów
    markers.forEach(({ marker, placeDetails }) => {
      marker.addTo(map);
      marker.bindPopup(`<strong>${placeDetails.name || 'Nazwa miejsca'}</strong>`);
    });

    // Przywracanie tras – polyline są dodawane podczas ładowania w loadRoutes()

    // Kliknięcie na mapę dodaje nowy marker
    map.on('click', (event) => {
      const markerTypeValue = document.getElementById('markerType').value;
      const { lat, lng } = event.latlng;
      const marker = L.circleMarker([lat, lng], {
        color: markerColors[markerTypeValue],
        radius: 10
      }).addTo(map);

      const placeDetails = {
TypeValue,
        name: '',
        description: '',
        address: '',
        image: ''
      };

      marker.bindPopup(`<strong>${placeDetails.name || 'Nazwa miejsca'}</strong>`);
      marker.on('click', () => {
        marker.openPopup();
      });

      markers.push({ marker, placeDetails });
      saveMarkers();
      updatePlacesList();
    });

    function updatePlacesList() {
      placesList.innerHTML = '';
      const selectedFilter = filterType.value;
      markers.forEach(({ placeDetails }, index) => {
        if (selectedFilter === 'Wszystko' || placeDetails.type === selectedFilter) {
          const placeItem = document.createElement('div');
          placeItem.className = 'place-item';
          const placeInfo = `
            <strong>Nazwa:</strong> ${placeDetails.name || 'Brak nazwy'}<br>
            <strong>Typ:</strong> ${placeDetails.type}<br>
            <strong>Opis:</strong> ${placeDetails.description || 'Brak opisu'}<br>
            <strong>Adres:</strong> ${placeDetails.address || 'Brak adresu'}
          `;
          const placeImage = placeDetails.image
            ? `<img src="${placeDetails.image}" alt="Zdjęcie miejsca" />`
            : '';
          const buttons = `
            <button onclick="editMarker(${index})">Edytuj</button>
            <button onclick="removeMarker(${index})">Usuń</button>
          `;
          placeItem.innerHTML = placeInfo + placeImage + buttons;
          placesList.appendChild(placeItem);
        }
      });
      updateRouteSelectors();
    }

    filterType.addEventListener('change', updatePlacesList);
    updatePlacesList(); // Inicjalne wczytanie listy punktów
    updateRoutesList(); // Inicjalne wczytanie listy tras

    // Funkcje dla markerów
    function saveMarkers() {
      const serializedMarkers = markers.map(({ marker, placeDetails }) => ({
        lat: marker.getLatLng().lat,
        lng: marker.getLatLng().lng,
        placeDetails
      }));
      localStorage.setItem('markers', JSON.stringify(serializedMarkers));
    }

    function loadMarkers() {
      const savedMarkers = JSON.parse(localStorage.getItem('markers')) || [];
      return savedMarkers.map(({ lat, lng, placeDetails }) => {
        const marker = L.circleMarker([lat, lng], {
          color: markerColors[placeDetails.type],
          radius: 10
        }).bindPopup(`<strong>${placeDetails.name || 'Nazwa miejsca'}</strong>`);
        return { marker, placeDetails };
      });
    }

    function removeMarker(index) {
      map.removeLayer(markers[index].marker);
      markers.splice(index, 1);
      saveMarkers();
      updatePlacesList();
      // Opcjonalnie: usuń trasy powiązane z danym punktem
      routes = routes.filter(route => route.startIndex !== index && route.endIndex !== index);
      saveRoutes();
      updateRoutesList();
    }

    function editMarker(index) {
      const placeDetails = markers[index].placeDetails;
      const newName = prompt("Ed:", placeDetails.name || '');
      const newDescription = prompt("Edytuj opis:", placeDetails.description || '');
      const newAddress = prompt("Edytuj adres:", placeDetails.address || '');
      const newImageURL = prompt("Edytuj URL do zdjęcia (opcjonalne):", placeDetails.image || '');
      if (newName !== null) { placeDetails.name = newName; }
      if (newDescription !== null) { placeDetails.description = newDescription; }
      if (newAddress !== null) { placeDetails.address = newAddress; }
      if (newImageURL !== null) { placeDetails.image = newImageURL; }
      markers[index].marker.bindPopup(`<strong>${placeDetails.name}</strong>`);
      saveMarkers();
      updatePlacesList();
    }

    // Funkcje dla tras

    // Aktualizacja listy rozwijanej przy tworzeniu trasy
    function updateRouteSelectors() {
      const startPointSelect = document.getElementById('startPoint');
      const endPointSelect = document.getElementById('endPoint');
      startPointSelect.innerHTML = '';
      endPointSelect.innerHTML = '';
      markers.forEach((item, index) => {
        const name = item.placeDetails.name || 'Punkt ' + (index + 1);
        const optionStart = document.createElement('option');
        optionStart.value = index;
        optionStart.text = name;
        startPointSelect.appendChild(optionStart);
        const optionEnd = document.createElement('option');
        optionEnd.value = index;
        optionEnd.text = name;
        endPointSelect.appendChild(optionEnd);
      });
    }

    // Dodawanie trasy
    function addRoute() {
      const startIndex = parseInt(document.getElementById('startPoint').value);
      const endIndex = parseInt(document.getElementById('endPoint').value);
      if (isNaN(startIndex) || isNaN(endIndex) || startIndex === endIndex) {
        alert('Wybierz dwa różne punkty dla trasy.');
        return;
      }
      const routeLocation = document.getElementById('routeLocation').value;
      const routeDate = document.getElementById('routeDate').value;
      const departureTime = document.getElementById('departureTime').value;
      const arrivalTime = document.getElementById('arrivalTime').value;
      const routeDescription = document.getElementById('routeDescription').value;

      const startMarker = markers[startIndex].marker;
      const endMarker = markers[endIndex].marker;
      const startLatLng = startMarker.getLatLng();
      const endLatLng = endMarker.getLatLng();

      const polyline = L.polyline([
        [startLatLng.lat, startLatLng.lng],
        [endLatLng.lat, endLatLng.lng]
      ], { color: 'purple' }).addTo(map);

      const route = {
        startIndex,
        endIndex,
        routeLocation,
        routeDate,
        departureTime,
        arrivalTime,
        routeDescription,
        coords: [
          { lat: startLatLng.lat, lng: startLatLng.lng },
          { lat: endLatLng.lat, lng: endLatLng.lng }
        ],
        line: polyline
      };

      routes.push(route);
      saveRoutes();
      updateRoutesList();
    }

    function saveRoutes() {
      const routesToStore = routes.map(route => ({
        startIndex: route.startIndex,
        endIndex: route.endIndex,
        routeLocation: route.routeLocation,
        routeDate: route.routeDate,
        departureTime: route.departureTime,
        arrivalTime: route.arrivalTime,
        routeDescription: route.routeDescription,
        coords: route.coords
      }));
      localStorage.setItem('routes', JSON.stringify(routesToStore));
    }

    function loadRoutes() {
      const storedRoutes = JSON.parse(localStorage.getItem('routes')) || [];
      return storedRoutes.map(routeData => {
        const polyline = L.polyline([
          [routeData.coords[0].lat, routeData.coords[0].lng],
          [routeData.coords[1].lat, routeData.coords[1].lng]
        ], { color: 'purple' }).addTo(map);
        return { ...routeData, line: polyline };
      });
    }

    function updateRoutesList() {
      const routesList = document.getElementById('routesList');
      routesList.innerHTML = '';
      routes.forEach((route, index) => {
        const routeItem = document.createElement('div');
        routeItem.className = 'route-item';
        const startName = markers[route.startIndex] ? (markers[route.startIndex].placeDetails.name || 'Punkt ' + (route.startIndex + 1)) : 'Nieznany';
        const endName = markers[route.endIndex] ? (markers[route.endIndex].placeDetails.name || 'Punkt ' + (route.endIndex + 1)) : 'Nieznany';
        const itemHTML = `
          <strong>Trasa z:</strong> ${startName} <strong>do</strong> ${endName}<br>
          <strong>Miejsce:</strong> ${route.routeLocation || 'Brak danych'}<br>
          <strong>Data:</strong> ${route.routeDate || 'Brak daty'}<br>
          <strong>Odjazd:</strong> ${route.departureTime || '-'} 
          <strong>Przyjazd:</strong> ${route.arrivalTime || '-'}<br>
          <strong>Opis:</strong> ${route.routeDescription || 'Brak opisu'}
        `;
        const buttons = `
          <button onclick="editRoute(${index})">Edytuj</button>
          <button onclick="removeRoute(${index})">Usuń</button>
        `;
        routeItem.innerHTML = itemHTML + buttons;
        routesList.appendChild(routeItem);
      });
    }

    function removeRoute(index) {
      map.removeLayer(routes[index].line);
      routes.splice(index, 1);
      saveRoutes();
      updateRoutesList();
    }

    function editRoute(index) {
      const route = routes[index];
      const newStart = prompt("Wprowadź nowy indeks punktu początkowego (liczba):", route.startIndex);
      const newEnd = prompt("Wprowadź nowy indeks punktu końcowego (liczba):", route.endIndex);
      const newRouteLocation = prompt("Edytuj miejsce:", route.routeLocation);
      const newRouteDate = prompt("Edytuj datę (YYYY-MM-DD):", route.routeDate);
      const newDepartureTime = prompt("Edytuj godzinę odjazdu (HH:MM):", route.departureTime);
      const newArrivalTime = prompt("Edytuj godzinę przyjazdu (HH:MM):", route.arrivalTime);
      const newRouteDescription = prompt("Edytuj opis:", route.routeDescription);

      if (newStart !== null) route.startIndex = parseInt(newStart);
      if (newEnd !== null) route.endIndex = parseInt(newEnd);
      if (newRouteLocation !== null) route.routeLocation = newRouteLocation;
      if (newRouteDate !== null) route.routeDate = newRouteDate;
      if (newDepartureTime !== null) route.departureTime = newDepartureTime;
      if (newArrivalTime !== null) route.arrivalTime = newArrivalTime;
      if (newRouteDescription !== null) route.routeDescription = newRouteDescription;

      map.removeLayer(route.line);
      const newStartMarker = markers[route.startIndex].marker;
      const newEndMarker = markers[route.endIndex].marker;
      const newStartLatLng = newStartMarker.getLatLng();
      const newEndLatLng = newEndMarker.getLatLng();
      route.coords = [
        { lat: newStartLatLng.lat, lng: newStartLatLng.lng },
        { lat: newEndLatLng.lat, lng: newEndLatLng.lng }
      ];
      route.line = L.polyline([
        [newStartLatLng.lat, newStartLatLng.lng],
        [newEndLatLng.lat, newEndLatLng.lng]
      ], { color: 'purple' }).addTo(map);

      saveRoutes();
      updateRoutesList();
    }
  </script>
</body>
</html>
