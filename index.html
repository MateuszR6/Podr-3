<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Podróży z Leaflet.js</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <style>
    #map {
      height: 500px;
      width: 100%;
      margin-top: 20px;
    }
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .controls {
      margin: 10px;
    }
    .controls select {
      margin-right: 10px;
    }
    .controls button {
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <h1>Mapa Podróży</h1>
  <p>Wybierz typ punktu, a następnie kliknij na mapie, aby dodać marker.</p>
  <div class="controls">
    <select id="markerType">
      <option value="Jedzenie">Jedzenie</option>
      <option value="Nocleg">Nocleg</option>
      <option value="Atrakcja">Atrakcja</option>
    </select>
    <button id="removeMarkers">Usuń wszystkie markery</button>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    // Inicjalizacja mapy
    const map = L.map('map').setView([52.2, 21.0], 6);

    // Dodanie warstwy mapy OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Kolekcja markerów
    const markers = [];

    // Funkcje kolorów markerów w zależności od typu
    const markerColors = {
      Jedzenie: 'red',
      Nocleg: 'blue',
      Atrakcja: 'green'
    };

    // Obsługa kliknięcia na mapę
    map.on('click', (event) => {
      const markerType = document.getElementById('markerType').value;
      const { lat, lng } = event.latlng;

      const marker = L.marker([lat, lng], {
        icon: L.icon({
          iconUrl: `https://placehold.co/25x25/${markerColors[markerType]}/ffffff`,
          iconSize: [25, 25],
          iconAnchor: [12, 25]
        })
      }).addTo(map).bindPopup(`${markerType}:<br>Lat: ${lat.toFixed(4)}<br>Lng: ${lng.toFixed(4)}`);

      markers.push(marker);
    });

    // Funkcja usuwania markerów
    document.getElementById('removeMarkers').addEventListener('click', () => {
      markers.forEach(marker => map.removeLayer(marker));
      markers.length = 0; // Czyszczenie listy markerów
    });
  </script>
</body>
</html>
