<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Podróży z Leaflet.js</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <style>
    #map {
      height: 500px;
      width: 100%;
      margin-top: 20px;
    }
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .info {
      margin: 10px;
    }
  </style>
</head>
<body>
  <h1>Mapa Podróży</h1>
  <p class="info">Kliknij na mapie, aby dodać punkt!</p>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    // Inicjalizacja mapy
    const map = L.map('map').setView([52.2, 21.0], 6);

    // Dodanie warstwy mapy OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Funkcja dodająca marker po kliknięciu na mapę
    map.on('click', (event) => {
      const { lat, lng } = event.latlng;
      L.marker([lat, lng]).addTo(map)
        .bindPopup(`Punkt podróży:<br>Lat: ${lat.toFixed(4)}<br>Lng: ${lng.toFixed(4)}`)
        .openPopup();
    });
  </script>
</body>
</html>
