<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Podróży - Responsywność</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    #map {
      height: 500px;
      width: 100%;
      margin-top: 20px;
    }

    .controls, .filter {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 10px 0;
    }

    .controls select, .filter select {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
    }

    #placesList {
      margin-top: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
      padding: 10px;
    }

    .place-item {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
    }

    .place-item img {
      max-width: 100%;
      height: auto;
      display: block;
      margin-top: 10px;
    }

    .place-item button {
      margin-top: 10px;
      padding: 5px 10px;
      font-size: 14px;
    }

    h1, h2 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    @media screen and (max-width: 768px) {
      #map {
        height: 300px;
      }

      body {
        padding: 10px;
      }

      h1, h2 {
        font-size: 20px;
      }

      .controls select, .filter select {
        font-size: 14px;
        padding: 8px;
      }

      .place-item button {
        font-size: 12px;
        padding: 5px 8px;
      }
    }
  </style>
</head>
<body>
  <h1>Mapa Podróży</h1>
  <div class="controls">
    <select id="markerType">
      <option value="Jedzenie">Jedzenie</option>
      <option value="Nocleg">Nocleg</option>
      <option value="Atrakcja">Atrakcja</option>
    </select>
  </div>
  <div id="map"></div>
  <h2>Lista punktów</h2>
  <div class="filter">
    <label for="filterType">Filtruj według typu:</label>
    <select id="filterType">
      <option value="Wszystko">Wszystko</option>
      <option value="Jedzenie">Jedzenie</option>
      <option value="Nocleg">Nocleg</option>
      <option value="Atrakcja">Atrakcja</option>
    </select>
  </div>
  <div id="placesList"></div>
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([52.2, 21.0], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const markers = [];
    const markerColors = {
      Jedzenie: 'red',
      Nocleg: 'blue',
      Atrakcja: 'green'
    };

    const placesList = document.getElementById('placesList');
    const filterType = document.getElementById('filterType');

    map.on('click', (event) => {
      const markerType = document.getElementById('markerType').value;
      const { lat, lng } = event.latlng;

      const marker = L.circleMarker([lat, lng], {
        color: markerColors[markerType],
        radius: 10
      }).addTo(map);

      const placeDetails = {
        type: markerType,
        name: '',
        description: '',
        address: '',
        image: ''
      };

      marker.bindPopup(`<strong>${placeDetails.name || 'Nazwa miejsca'}</strong>`);

      marker.on('click', () => {
        marker.openPopup();
      });

      markers.push({ marker, placeDetails });
      updatePlacesList();
    });

    function updatePlacesList() {
      placesList.innerHTML = '';
      const selectedFilter = filterType.value;

      markers.forEach(({ placeDetails }, index) => {
        if (selectedFilter === 'Wszystko' || placeDetails.type === selectedFilter) {
          const placeItem = document.createElement('div');
          placeItem.className = 'place-item';

          const placeInfo = `
            <strong>Nazwa:</strong> ${placeDetails.name || 'Brak nazwy'}<br>
            <strong>Typ:</strong> ${placeDetails.type}<br>
            <strong>Opis:</strong> ${placeDetails.description || 'Brak opisu'}<br>
            <strong>Adres:</strong> ${placeDetails.address || 'Brak adresu'}
          `;

          const placeImage = placeDetails.image
            ? `<img src="${placeDetails.image}" alt="Zdjęcie miejsca" />`
            : '';

          const buttons = `
            <button onclick="editMarker(${index})">Edytuj</button>
            <button onclick="removeMarker(${index})">Usuń</button>
          `;

          placeItem.innerHTML = placeInfo + placeImage + buttons;

          placesList.appendChild(placeItem);
        }
      });
    }

    filterType.addEventListener('change', updatePlacesList);

    function removeMarker(index) {
      map.removeLayer(markers[index].marker);
      markers.splice(index, 1);
      updatePlacesList();
    }

    function editMarker(index) {
      const placeDetails = markers[index].placeDetails;

      const newName = prompt("Edytuj nazwę miejsca:", placeDetails.name || '');
      const newDescription = prompt("Edytuj opis:", placeDetails.description || '');
      const newAddress = prompt("Edytuj adres:", placeDetails.address || '');
      const newImageURL = prompt("Edytuj URL do zdjęcia (opcjonalne):", placeDetails.image || '');

      if (newName !== null) {
        placeDetails.name = newName;
      }
      if (newDescription !== null) {
        placeDetails.description = newDescription;
      }
      if (newAddress !== null) {
        placeDetails.address = newAddress;
      }
      if (newImageURL !== null) {
        placeDetails.image = newImageURL;
      }

      markers[index].marker.bindPopup(`<strong>${placeDetails.name}</strong>`);

      updatePlacesList();
    }
  </script>
</body>
</html>
