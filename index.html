<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Podróży z Edycją Markerów</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <style>
    #map {
      height: 500px;
      width: 100%;
      margin-top: 20px;
    }
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .controls {
      margin: 10px;
    }
    .controls select {
      margin-right: 10px;
    }
    .controls button {
      margin-left: 10px;
    }
    #placesList {
      margin-top: 20px;
      text-align: left;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .place-item {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
    }
    .place-item img {
      max-width: 100px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Mapa Podróży</h1>
  <p>Wybierz typ punktu, a następnie kliknij na mapie, aby dodać marker.</p>
  <div class="controls">
    <select id="markerType">
      <option value="Jedzenie">Jedzenie</option>
      <option value="Nocleg">Nocleg</option>
      <option value="Atrakcja">Atrakcja</option>
    </select>
  </div>
  <div id="map"></div>
  <div id="placesList"></div>
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([52.2, 21.0], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const markers = [];
    const markerColors = {
      Jedzenie: 'red',
      Nocleg: 'blue',
      Atrakcja: 'green'
    };

    const placesList = document.getElementById('placesList');

    map.on('click', (event) => {
      const markerType = document.getElementById('markerType').value;
      const { lat, lng } = event.latlng;

      const marker = L.circleMarker([lat, lng], {
        color: markerColors[markerType],
        radius: 10
      }).addTo(map);

      const placeDetails = {
        type: markerType,
        lat: lat.toFixed(4),
        lng: lng.toFixed(4),
        description: '',
        image: ''
      };

      marker.on('click', () => {
        const newDescription = prompt("Wprowadź szczegóły punktu:", placeDetails.description || '');
        const newImageURL = prompt("Wprowadź URL do zdjęcia (opcjonalne):", placeDetails.image || '');

        placeDetails.description = newDescription || placeDetails.description;
        placeDetails.image = newImageURL || placeDetails.image;

        updatePlacesList();
      });

      markers.push({ marker, placeDetails });
      updatePlacesList();
    });

    function updatePlacesList() {
      placesList.innerHTML = '';
      markers.forEach(({ placeDetails }, index) => {
        const placeItem = document.createElement('div');
        placeItem.className = 'place-item';

        const placeInfo = `
          <strong>Typ:</strong> ${placeDetails.type}<br>
          <strong>Lat:</strong> ${placeDetails.lat}, <strong>Lng:</strong> ${placeDetails.lng}<br>
          <strong>Opis:</strong> ${placeDetails.description || 'Brak opisu'}
        `;

        const placeImage = placeDetails.image
          ? `<img src="${placeDetails.image}" alt="Zdjęcie miejsca" />`
          : '';

        const removeButton = `<button onclick="removeMarker(${index})">Usuń</button>`;
        placeItem.innerHTML = placeInfo + placeImage + removeButton;

        placesList.appendChild(placeItem);
      });
    }

    function removeMarker(index) {
      map.removeLayer(markers[index].marker);
      markers.splice(index, 1);
      updatePlacesList();
    }
  </script>
</body>
</html>
