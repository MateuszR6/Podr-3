<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Podróży z Trasami i Kosztami</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    #map {
      height: 500px;
      width: 100%;
      margin-top: 20px;
    }
    .controls, .filter {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 10px 0;
    }
    .controls select,
    .controls input,
    .controls textarea,
    .filter select {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
    }
    #placesList, #routesList, #totalCosts, #extraCostsList {
      margin-top: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
      padding: 10px;
    }
    .place-item, .route-item {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
    .route-item {
      background-color: #eef;
    }
    .place-item img {
      max-width: 100%;
      height: auto;
      display: block;
      margin-top: 10px;
    }
    .place-item button, .route-item button, #routeForm button {
      margin-top: 10px;
      padding: 5px 10px;
      font-size: 14px;
    }
    #routeForm, #extraCostsForm {
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 20px;
      border-radius: 5px;
      background-color: #fafafa;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <h1>Mapa Podróży</h1>
  <div class="controls">
    <select id="markerType">
      <option value="Jedzenie">Jedzenie</option>
      <option value="Nocleg">Nocleg</option>
      <option value="Atrakcja">Atrakcja</option>
    </select>
  </div>
  <div id="map"></div>
  
  <h2>Lista punktów</h2>
  <div class="filter">
    <label for="filterType">Filtruj według typu:</label>
    <select id="filterType">
      <option value="Wszystko">Wszystko</option>
      <option value="Jedzenie">Jedzenie</option>
      <option value="Nocleg">Nocleg</option>
      <option value="Atrakcja">Atrakcja</option>
    </select>
  </div>
  <div id="placesList"></div>
  
  <!-- Sekcja tworzenia trasy -->
  <h2>Tworzenie trasy</h2>
  <div id="routeForm">
    <div class="controls">
      <label for="startPoint">Punkt początkowy:</label>
      <select id="startPoint"></select>
      <label for="endPoint">Punkt końcowy:</label>
      <select id="endPoint"></select>
    </div>
    <div class="controls">
      <label for="departureDate">Data odjazdu:</label>
      <input type="date" id="departureDate">
      <label for="departureTime">Godzina odjazdu:</label>
      <input type="time" id="departureTime">
    </div>
    <div class="controls">
      <label for="arrivalDate">Data przyjazdu:</label>
      <input type="date" id="arrivalDate">
      <label for="arrivalTime">Godzina przyjazdu:</label>
      <input type="time" id="arrivalTime">
    </div>
    <div class="controls">
      <label for="transportCost">Koszt:</label>
      <input type="text" id="transportCost" placeholder="Podaj koszt transportu">
    </div>
    <div class="controls">
      <label for="routeDescription">Opis:</label>
      <textarea id="routeDescription" placeholder="Opis trasy"></textarea>
    </div>
    <button onclick="addRoute()">Dodaj trasę</button>
  </div>
  
  <h2>Lista tras</h2>
  <div id="routesList"></div>
  
  <!-- Sekcja kosztów łącznie -->
  <h2>Koszty łącznie</h2>
  <div id="totalCosts"></div>
  
  <!-- Sekcja kosztów dodatkowych -->
  <h2>Koszty dodatkowe</h2>
  <div id="extraCostsForm">
    <input type="text" id="extraCostDesc" placeholder="Opis kosztu">
    <input type="number" id="extraCostAmount" placeholder="Kwota">
    <button onclick="addExtraCost()">Dodaj koszt dodatkowy</button>
  </div>
  <div id="extraCostsList"></div>
  
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([52.2, 21.0], 6);
    const markerColors = {
      Jedzenie: 'red',
      Nocleg: 'blue',
      Atrakcja: 'green'
    };

    // Wczytanie markerów, tras i kosztów dodatkowych z LocalStorage
    const markers = loadMarkers();
    let routes = loadRoutes();
    let extraCosts = loadExtraCosts();
    
    const placesList = document.getElementById('placesList');
    const filterType = document.getElementById('filterType');
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    
    // Odtwarzamy markery na mapie
    markers.forEach(({ marker, placeDetails }) => {
      marker.addTo(map);
      marker.bindPopup(`<strong>${placeDetails.name || 'Nazwa miejsca'}</strong>`);
    });
    
    // Kliknięcie na mapie – dodawanie nowego markera z natychmiastowym promptem na nazwę
    map.on('click', (event) => {
      const markerTypeValue = document.getElementById('markerType').value;
      const { lat, lng } = event.latlng;
      
      // Pytamy o nazwę punktu
      const markerName = prompt("Wprowadź nazwę punktu:");
      
      const marker = L.circleMarker([lat, lng], {
        color: markerColors[markerTypeValue],
        radius: 10
      }).addTo(map);
      
      const placeDetails = {
        type: markerTypeValue,
        name: markerName || '',
        description: '',
        address: '',
        cost: '',  // Nowe pole "Koszt"
        image: ''
      };
      
      marker.bindPopup(`<strong>${placeDetails.name || 'Nazwa miejsca'}</strong>`);
      marker.on('click', () => { marker.openPopup(); });
      
      markers.push({ marker, placeDetails });
      saveMarkers();
      updatePlacesList();
    });
    
    function updatePlacesList() {
      placesList.innerHTML = '';
      const selectedFilter = filterType.value;
      markers.forEach(({ placeDetails }, index) => {
        if (selectedFilter === 'Wszystko' || placeDetails.type === selectedFilter) {
          const placeItem = document.createElement('div');
          placeItem.className = 'place-item';
          const placeInfo = `
            <strong>Nazwa:</strong> ${placeDetails.name || 'Brak nazwy'}<br>
            <strong>Typ:</strong> ${placeDetails.type}<br>
            <strong>Opis:</strong> ${placeDetails.description || 'Brak opisu'}<br>
            <strong>Adres:</strong> ${placeDetails.address || 'Brak adresu'}<br>
            <strong>Koszt:</strong> ${placeDetails.cost || 'Brak kosztu'}
          `;
          const placeImage = placeDetails.image
            ? `<br><img src="${placeDetails.image}" alt="Zdjęcie miejsca" />`
            : '';
          const buttons = `
            <br><button onclick="editMarker(${index})">Edytuj</button>
            <button onclick="removeMarker(${index})">Usuń</button>
          `;
          placeItem.innerHTML = placeInfo + placeImage + buttons;
          placesList.appendChild(placeItem);
        }
      });
      updateRouteSelectors();
      updateSummaryCosts();
    }
    
    filterType.addEventListener('change', updatePlacesList);
    updatePlacesList(); // Inicjalne odświeżenie listy punktów
    updateRoutesList(); // Inicjalne odświeżenie listy tras
    updateExtraCostsList(); // Inicjalne odświeżenie listy kosztów dodatkowych
    
    // Funkcje obsługujące markery
    function saveMarkers() {
      const serializedMarkers = markers.map(({ marker, placeDetails }) => ({
        lat: marker.getLatLng().lat,
        lng: marker.getLatLng().lng,
        placeDetails
      }));
      localStorage.setItem('markers', JSON.stringify(serializedMarkers));
    }
    
    function loadMarkers() {
      const savedMarkers = JSON.parse(localStorage.getItem('markers')) || [];
      return savedMarkers.map(({ lat, lng, placeDetails }) => {
        const marker = L.circleMarker([lat, lng], {
          color: markerColors[placeDetails.type],
          radius: 10
        }).bindPopup(`<strong>${placeDetails.name || 'Nazwa miejsca'}</strong>`);
        return { marker, placeDetails };
      });
    }
    
    function removeMarker(index) {
      map.removeLayer(markers[index].marker);
      markers.splice(index, 1);
      saveMarkers();
      updatePlacesList();
      // Usuwamy trasy powiązane z danym punktem
      routes = routes.filter(route => route.startIndex !== index && route.endIndex !== index);
      saveRoutes();
      updateRoutesList();
      updateSummaryCosts();
    }
    
    function editMarker(index) {
      const placeDetails = markers[index].placeDetails;
      const newName = prompt("Edytuj nazwę miejsca:", placeDetails.name || '');
      const newDescription = prompt("Edytuj opis:", placeDetails.description || '');
      const newAddress = prompt("Edytuj adres:", placeDetails.address || '');
      const newCost = prompt("Edytuj koszt:", placeDetails.cost || '');
      const newImageURL = prompt("Edytuj URL do zdjęcia (opcjonalne):", placeDetails.image || '');
      if (newName !== null) { placeDetails.name = newName; }
      if (newDescription !== null) { placeDetails.description = newDescription; }
      if (newAddress !== null) { placeDetails.address = newAddress; }
      if (newCost !== null) { placeDetails.cost = newCost; }
      if (newImageURL !== null) { placeDetails.image = newImageURL; }
      markers[index].marker.bindPopup(`<strong>${placeDetails.name}</strong>`);
      saveMarkers();
      updatePlacesList();
    }
    
    // Funkcje obsługujące trasy
    function updateRouteSelectors() {
      const startPointSelect = document.getElementById('startPoint');
      const endPointSelect = document.getElementById('endPoint');
      startPointSelect.innerHTML = '';
      endPointSelect.innerHTML = '';
      markers.forEach((item, index) => {
        const name = item.placeDetails.name || 'Punkt ' + (index + 1);
        const optionStart = document.createElement('option');
        optionStart.value = index;
        optionStart.text = name;
        startPointSelect.appendChild(optionStart);
        const optionEnd = document.createElement('option');
        optionEnd.value = index;
        optionEnd.text = name;
        endPointSelect.appendChild(optionEnd);
      });
    }
    
    function addRoute() {
      const startIndex = parseInt(document.getElementById('startPoint').value);
      const endIndex = parseInt(document.getElementById('endPoint').value);
      if (isNaN(startIndex) || isNaN(endIndex) || startIndex === endIndex) {
        alert('Wybierz dwa różne punkty dla trasy.');
        return;
      }
      
      const departureDate = document.getElementById('departureDate').value;
      const departureTime = document.getElementById('departureTime').value;
      const arrivalDate = document.getElementById('arrivalDate').value;
      const arrivalTime = document.getElementById('arrivalTime').value;
      const transportCost = document.getElementById('transportCost').value;
      const routeDescription = document.getElementById('routeDescription').value;
      
      const startMarker = markers[startIndex].marker;
      const endMarker = markers[endIndex].marker;
      const startLatLng = startMarker.getLatLng();
      const endLatLng = endMarker.getLatLng();
      
      const polyline = L.polyline([
        [startLatLng.lat, startLatLng.lng],
        [endLatLng.lat, endLatLng.lng]
      ], { color: 'purple' }).addTo(map);
      
      const route = {
        startIndex,
        endIndex,
        departureDate,
        departureTime,
        arrivalDate,
        arrivalTime,
        transportCost,
        routeDescription,
        coords: [
          { lat: startLatLng.lat, lng: startLatLng.lng },
          { lat: endLatLng.lat, lng: endLatLng.lng }
        ],
        line: polyline
      };
      
      routes.push(route);
      saveRoutes();
      updateRoutesList();
      updateSummaryCosts();
    }
    
    function saveRoutes() {
      const routesToStore = routes.map(route => ({
        startIndex: route.startIndex,
        endIndex: route.endIndex,
        departureDate: route.departureDate,
        departureTime: route.departureTime,
        arrivalDate: route.arrivalDate,
        arrivalTime: route.arrivalTime,
        transportCost: route.transportCost,
        routeDescription: route.routeDescription,
        coords: route.coords
      }));
      localStorage.setItem('routes', JSON.stringify(routesToStore));
    }
    
    function loadRoutes() {
      const storedRoutes = JSON.parse(localStorage.getItem('routes')) || [];
      return storedRoutes.map(routeData => {
        const polyline = L.polyline([
          [routeData.coords[0].lat, routeData.coords[0].lng],
          [routeData.coords[1].lat, routeData.coords[1].lng]
        ], { color: 'purple' }).addTo(map);
        return { ...routeData, line: polyline };
      });
    }
    
    function updateRoutesList() {
      const routesList = document.getElementById('routesList');
      routesList.innerHTML = '';
      routes.forEach((route, index) => {
        const routeItem = document.createElement('div');
        routeItem.className = 'route-item';
        const startName = markers[route.startIndex]
          ? (markers[route.startIndex].placeDetails.name || 'Punkt ' + (route.startIndex + 1))
          : 'Nieznany';
        const endName = markers[route.endIndex]
          ? (markers[route.endIndex].placeDetails.name || 'Punkt ' + (route.endIndex + 1))
          : 'Nieznany';
        const itemHTML = `
          <strong>Trasa z:</strong> ${startName} <strong>do</strong> ${endName}<br>
          <strong>Data odjazdu:</strong> ${route.departureDate || 'Brak daty'}<br>
          <strong>Godzina odjazdu:</strong> ${route.departureTime || '-'}<br>
          <strong>Data przyjazdu:</strong> ${route.arrivalDate || 'Brak daty'}<br>
          <strong>Godzina przyjazdu:</strong> ${route.arrivalTime || '-'}<br>
          <strong>Koszt transportu:</strong> ${route.transportCost || 'Brak kosztu'}<br>
          <strong>Opis:</strong> ${route.routeDescription || 'Brak opisu'}
        `;
        const buttons = `
          <button onclick="editRoute(${index})">Edytuj</button>
          <button onclick="removeRoute(${index})">Usuń</button>
        `;
        routeItem.innerHTML = itemHTML + buttons;
        routesList.appendChild(routeItem);
      });
      updateSummaryCosts();
    }
    
    function removeRoute(index) {
      map.removeLayer(routes[index].line);
      routes.splice(index, 1);
      saveRoutes();
      updateRoutesList();
      updateSummaryCosts();
    }
    
    function editRoute(index) {
      const route = routes[index];
      const newStart = prompt("Wprowadź nowy indeks punktu początkowego (liczba):", route.startIndex);
      const newEnd = prompt("Wprowadź nowy indeks punktu końcowego (liczba):", route.endIndex);
      const newDepartureDate = prompt("Edytuj datę odjazdu (YYYY-MM-DD):", route.departureDate);
      const newDepartureTime = prompt("Edytuj godzinę odjazdu (HH:MM):", route.departureTime);
      const newArrivalDate = prompt("Edytuj datę przyjazdu (YYYY-MM-DD):", route.arrivalDate);
      const newArrivalTime = prompt("Edytuj godzinę przyjazdu (HH:MM):", route.arrivalTime);
      const newTransportCost = prompt("Edytuj koszt transportu:", route.transportCost);
      const newRouteDescription = prompt("Edytuj opis:", route.routeDescription);
      
      if (newStart !== null) route.startIndex = parseInt(newStart);
      if (newEnd !== null) route.endIndex = parseInt(newEnd);
      if (newDepartureDate !== null) route.departureDate = newDepartureDate;
      if (newDepartureTime !== null) route.departureTime = newDepartureTime;
      if (newArrivalDate !== null) route.arrivalDate = newArrivalDate;
      if (newArrivalTime !== null) route.arrivalTime = newArrivalTime;
      if (newTransportCost !== null) route.transportCost = newTransportCost;
      if (newRouteDescription !== null) route.routeDescription = newRouteDescription;
      
      map.removeLayer(route.line);
      const newStartMarker = markers[route.startIndex].marker;
      const newEndMarker = markers[route.endIndex].marker;
      const newStartLatLng = newStartMarker.getLatLng();
      const newEndLatLng = newEndMarker.getLatLng();
      route.coords = [
        { lat: newStartLatLng.lat, lng: newStartLatLng.lng },
        { lat: newEndLatLng.lat, lng: newEndLatLng.lng }
      ];
      route.line = L.polyline([
        [newStartLatLng.lat, newStartLatLng.lng],
        [newEndLatLng.lat, newEndLatLng.lng]
      ], { color: 'purple' }).addTo(map);
      
      saveRoutes();
      updateRoutesList();
      updateSummaryCosts();
    }
    
    // Funkcje związane z kosztami dodatkowych
    function addExtraCost() {
      const desc = document.getElementById('extraCostDesc').value.trim();
      const amount = parseFloat(document.getElementById('extraCostAmount').value);
      if (!desc || isNaN(amount)) {
        alert("Podaj opis i poprawną kwotę kosztu dodatkowego.");
        return;
      }
      extraCosts.push({ desc, amount });
      saveExtraCosts();
      updateExtraCostsList();
      updateSummaryCosts();
      document.getElementById('extraCostDesc').value = "";
      document.getElementById('extraCostAmount').value = "";
    }
    
    function updateExtraCostsList() {
      const extraCostsList = document.getElementById('extraCostsList');
      extraCostsList.innerHTML = '';
      extraCosts.forEach((extra, index) => {
        const div = document.createElement('div');
        div.innerHTML = `<strong>${extra.desc}:</strong> ${extra.amount} 
          <button onclick="removeExtraCost(${index})">Usuń</button>`;
        extraCostsList.appendChild(div);
      });
    }
    
    function removeExtraCost(index) {
      extraCosts.splice(index, 1);
      saveExtraCosts();
      updateExtraCostsList();
      updateSummaryCosts();
    }
    
    function saveExtraCosts() {
      localStorage.setItem('extraCosts', JSON.stringify(extraCosts));
    }
    
    function loadExtraCosts() {
      return JSON.parse(localStorage.getItem('extraCosts')) || [];
    }
    
    // Funkcja do aktualizacji podsumowania kosztów
    function updateSummaryCosts() {
      let transportTotal = 0;
      routes.forEach(route => {
        const cost = parseFloat(route.transportCost);
        if (!isNaN(cost)) {
          transportTotal += cost;
        }
      });
      
      let noclegTotal = 0, atrakcjaTotal = 0, jedzenieTotal = 0;
      markers.forEach(item => {
        const cost = parseFloat(item.placeDetails.cost);
        if (!isNaN(cost)) {
          if (item.placeDetails.type === "Nocleg") {
            noclegTotal += cost;
          } else if (item.placeDetails.type === "Atrakcja") {
            atrakcjaTotal += cost;
          } else if (item.placeDetails.type === "Jedzenie") {
            jedzenieTotal += cost;
          }
        }
      });
      
      let extraTotal = 0;
      extraCosts.forEach(extra => {
        extraTotal += extra.amount;
      });
      
      const total = transportTotal + noclegTotal + atrakcjaTotal + jedzenieTotal + extraTotal;
      const totalCostsDiv = document.getElementById('totalCosts');
      totalCostsDiv.innerHTML = `
        <p><strong>Koszty transportu:</strong> ${transportTotal.toFixed(2)}</p>
        <p><strong>Koszty noclegów:</strong> ${noclegTotal.toFixed(2)}</p>
        <p><strong>Koszty atrakcji:</strong> ${atrakcjaTotal.toFixed(2)}</p>
        <p><strong>Koszty jedzenia:</strong> ${jedzenieTotal.toFixed(2)}</p>
        <p><strong>Koszty dodatkowe:</strong> ${extraTotal.toFixed(2)}</p>
        <p><strong>Całkowity koszt:</strong> ${total.toFixed(2)}</p>
      `;
    }
  </script>
</body>
</html>
