<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Podróży z Trasami i Kosztami</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    #map {
      height: 500px;
      width: 100%;
      margin-top: 20px;
    }
    .controls, .filter {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin: 10px 0;
    }
    .controls select,
    .controls input,
    .controls textarea,
    .filter select {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
    }
    #placesList, #routesList, #totalCosts, #extraCostsList {
      margin-top: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
      padding: 10px;
    }
    .place-item, .route-item {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
      position: relative;
    }
    .route-item {
      background-color: #eef;
    }
    .place-item img {
      max-width: 100%;
      height: auto;
      display: block;
      margin-top: 10px;
    }
    /* Ikony: edycji oraz kosza – kosz jest czarny */
    .edit-icon,
    .delete-icon {
      position: absolute;
      top: 10px;
      cursor: pointer;
      font-size: 20px;
    }
    .edit-icon {
      right: 40px;
    }
    .delete-icon {
      right: 10px;
    }
    .delete-icon:hover {
      color: red;
    }
    /* Modal do potwierdzania usunięcia */
    #deleteConfirmModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    #deleteConfirmModal > div {
      display: inline-block;
      background: white;
      padding: 20px;
      margin-top: 100px;
      border-radius: 5px;
    }
    #deleteConfirmModal button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }
    /* Modal do edycji punktu */
    #markerEditModal {
      display: none; 
      position: fixed; 
      top: 0; left: 0; right: 0; bottom: 0; 
      background-color: rgba(0,0,0,0.5);
    }
    #markerEditModal > div {
      background: white;
      margin: 100px auto;
      padding: 20px;
      width: 300px;
      border-radius: 5px;
      text-align: center;
    }
    #markerEditModal input {
      width: 80%;
      padding: 5px;
      margin-top: 10px;
    }
    #markerEditModal button {
      margin-top: 15px;
      padding: 5px 10px;
      font-size: 14px;
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <h1>Mapa Podróży</h1>
  <div class="controls">
    <select id="markerType">
      <option value="Jedzenie">Jedzenie</option>
      <option value="Nocleg">Nocleg</option>
      <option value="Atrakcja">Atrakcja</option>
    </select>
  </div>
  <div id="map"></div>
  
  <h2>Lista punktów</h2>
  <div class="filter">
    <label for="filterType">Filtruj według typu:</label>
    <select id="filterType">
      <option value="Wszystko">Wszystko</option>
      <option value="Jedzenie">Jedzenie</option>
      <option value="Nocleg">Nocleg</option>
      <option value="Atrakcja">Atrakcja</option>
    </select>
  </div>
  <div id="placesList"></div>
  
  <!-- Modal do potwierdzenia usunięcia -->
  <div id="deleteConfirmModal">
    <div>
      <p>Czy na pewno chcesz usunąć ten element?</p>
      <button id="deleteConfirmYes">Tak</button>
      <button id="deleteConfirmNo">Anuluj</button>
    </div>
  </div>
  
  <!-- Modal do edycji punktu -->
  <div id="markerEditModal">
    <div>
      <h2 id="markerEditTitle">Edytuj punkt</h2>
      <label id="markerEditLabel"></label><br>
      <input type="text" id="markerEditInput"><br>
      <button id="markerEditNextBtn">Dalej</button>
      <button id="markerEditSkipBtn">Pomiń</button>
      <button id="markerEditCancelBtn">Anuluj</button>
    </div>
  </div>
  
  <!-- Poniżej pozostają dotychczasowe sekcje (tworzenie tras, koszty dodatkowe itd.)
       – w tym przykładzie dla przejrzystości prezentuję fragmenty związane z mapą i punktami. -->
  
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    // Inicjalizacja mapy i kafelków
    const map = L.map('map').setView([52.2, 21.0], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Wczytujemy zapisane markery z LocalStorage
    const markers = loadMarkers();
    const placesList = document.getElementById('placesList');
    const filterType = document.getElementById('filterType');

    // Modal do potwierdzenia usunięcia
    const deleteConfirmModal = document.getElementById('deleteConfirmModal');
    const deleteConfirmYes = document.getElementById('deleteConfirmYes');
    const deleteConfirmNo = document.getElementById('deleteConfirmNo');
    let markerToDeleteIndex = null;

    // Funkcja aktualizująca listę punktów
    function updatePlacesList() {
      placesList.innerHTML = '';
      markers.forEach(({ placeDetails }, index) => {
        const placeItem = document.createElement('div');
        placeItem.className = 'place-item';
        // Ikona edycji
        const editIcon = `<span class="edit-icon" onclick="startMarkerEdit(${index})" title="Edytuj">✏️</span>`;
        // Ikona kosza (czarny kosz)
        const deleteIcon = `<span class="delete-icon" onclick="confirmDeleteMarker(${index})" title="Usuń">🗑️</span>`;
        const placeInfo = `
          <strong>Nazwa:</strong> ${placeDetails.name || 'Brak nazwy'}<br>
          <strong>Typ:</strong> ${placeDetails.type || 'Brak typu'}<br>
          <strong>Opis:</strong> ${placeDetails.description || 'Brak opisu'}<br>
          <strong>Adres:</strong> ${placeDetails.address || 'Brak adresu'}<br>
          <strong>Koszt:</strong> ${placeDetails.cost || 'Brak kosztu'}
        `;
        placeItem.innerHTML = editIcon + deleteIcon + placeInfo;
        placesList.appendChild(placeItem);
      });
      // Aktualizuj rozwijane listy przy tworzeniu trasy, podsumowanie kosztów itd.
      updateRouteSelectors();
      updateSummaryCosts();
    }

    // Funkcja wywoływana przy kliknięciu ikony kosza – otwiera modal z potwierdzeniem
    function confirmDeleteMarker(index) {
      markerToDeleteIndex = index;
      deleteConfirmModal.style.display = 'block';
    }

    deleteConfirmYes.addEventListener('click', () => {
      if (markerToDeleteIndex !== null) {
        removeMarker(markerToDeleteIndex);
      }
      deleteConfirmModal.style.display = 'none';
    });

    deleteConfirmNo.addEventListener('click', () => {
      markerToDeleteIndex = null;
      deleteConfirmModal.style.display = 'none';
    });

    // Usuwanie markera
    function removeMarker(index) {
      map.removeLayer(markers[index].marker);
      markers.splice(index, 1);
      saveMarkers();
      updatePlacesList();
      // Dodatkowo – jeśli istnieją powiązane trasy, powinny zostać usunięte i zapisane (funkcjonalność zachowana)
      routes = routes.filter(route => route.startIndex !== index && route.endIndex !== index);
      saveRoutes();
      updateRoutesList();
      updateSummaryCosts();
    }

    // Funkcje zapisu/odczytu markerów z LocalStorage
    function loadMarkers() {
      const savedMarkers = JSON.parse(localStorage.getItem('markers')) || [];
      return savedMarkers.map(({ lat, lng, placeDetails }) => {
        const marker = L.circleMarker([lat, lng], { radius: 10 }).addTo(map);
        marker.bindPopup(`<strong>${placeDetails.name || 'Nazwa miejsca'}</strong>`);
        return { marker, placeDetails };
      });
    }
    function saveMarkers() {
      const serializedMarkers = markers.map(({ marker, placeDetails }) => ({
        lat: marker.getLatLng().lat,
        lng: marker.getLatLng().lng,
        placeDetails
      }));
      localStorage.setItem('markers', JSON.stringify(serializedMarkers));
    }

    // Przykładowa obsługa kliknięcia na mapie – dodawanie nowego markera (z promptem na nazwę)
    map.on('click', (event) => {
      const markerTypeValue = document.getElementById('markerType').value;
      const { lat, lng } = event.latlng;
      const markerName = prompt("Wprowadź nazwę punktu:");
      const marker = L.circleMarker([lat, lng], { color: markerTypeValue === "Jedzenie" ? "red" : markerTypeValue === "Nocleg" ? "blue" : "green", radius: 10 }).addTo(map);
      const placeDetails = {
        type: markerTypeValue,
        name: markerName || '',
        description: '',
        address: '',
        cost: '',
        image: ''
      };
      marker.bindPopup(`<strong>${placeDetails.name || 'Nazwa miejsca'}</strong>`);
      marker.on('click', () => { marker.openPopup(); });
      markers.push({ marker, placeDetails });
      saveMarkers();
      updatePlacesList();
    });

    // --- Funkcje obsługujące edycję markera (modal edycji krok po kroku) ---
    let editingMarkerIndex = null;
    // Kolejność pól: Nazwa, Typ, Opis, Adres, Koszt
    let editingFields = ["name", "type", "description", "address", "cost"];
    const editingFieldLabels = {
      name: "Nazwa",
      type: "Typ",
      description: "Opis",
      address: "Adres",
      cost: "Koszt"
    };
    let editingFieldIndex = 0;
    let editingData = {};

    const markerEditModal = document.getElementById('markerEditModal');
    const markerEditTitle = document.getElementById('markerEditTitle');
    const markerEditLabel = document.getElementById('markerEditLabel');
    const markerEditInput = document.getElementById('markerEditInput');
    const markerEditNextBtn = document.getElementById('markerEditNextBtn');
    const markerEditSkipBtn = document.getElementById('markerEditSkipBtn');
    const markerEditCancelBtn = document.getElementById('markerEditCancelBtn');

    function startMarkerEdit(index) {
      editingMarkerIndex = index;
      editingFieldIndex = 0;
      editingData = Object.assign({}, markers[index].placeDetails);
      showNextField();
    }
    function showNextField() {
      if (editingFieldIndex >= editingFields.length) {
        markers[editingMarkerIndex].placeDetails = Object.assign({}, editingData);
        markers[editingMarkerIndex].marker.bindPopup(`<strong>${editingData.name}</strong>`);
        saveMarkers();
        updatePlacesList();
        hideMarkerEditModal();
        return;
      }
      const fieldKey = editingFields[editingFieldIndex];
      markerEditLabel.textContent = editingFieldLabels[fieldKey] + ":";
      markerEditInput.value = editingData[fieldKey] || "";
      markerEditModal.style.display = "block";
    }
    function hideMarkerEditModal() {
      markerEditModal.style.display = "none";
    }
    markerEditNextBtn.addEventListener('click', () => {
      const fieldKey = editingFields[editingFieldIndex];
      const newValue = markerEditInput.value;
      if (newValue.trim() !== "") {
        editingData[fieldKey] = newValue;
      }
      editingFieldIndex++;
      showNextField();
    });
    markerEditSkipBtn.addEventListener('click', () => {
      editingFieldIndex++;
      showNextField();
    });
    markerEditCancelBtn.addEventListener('click', () => {
      hideMarkerEditModal();
    });

    // --- Funkcje związane z trasami, kosztami itd. (wcześniej stworzone) ---
    // Poniżej znajdują się funkcje tworzenia tras, obsługi kosztów dodatkowych oraz podsumowania kosztów.
    // Aby nie zastępować poprzedniej funkcjonalności, poniższy kod pozostaje bez zmian.
    
    // Przykładowe zmienne i funkcje dla tras:
    let routes = loadRoutes();
    function updateRouteSelectors() { /* ... */ }
    function addRoute() { /* ... */ }
    function saveRoutes() { /* ... */ }
    function loadRoutes() { /* ... */ return []; }
    
    // Przykładowe funkcje obsługujące koszty dodatkowe:
    let extraCosts = loadExtraCosts();
    function addExtraCost() { /* ... */ }
    function updateExtraCostsList() { /* ... */ }
    function saveExtraCosts() { /* ... */ }
    function loadExtraCosts() { return JSON.parse(localStorage.getItem('extraCosts')) || []; }
    function updateSummaryCosts() { /* ... */ }
    
    // Aktualne wywołania funkcji inicjalizujących:
    updatePlacesList();
    // updateRoutesList(); updateExtraCostsList(); updateSummaryCosts(); – pozostawione w ramach pełnej funkcjonalności

  </script>
</body>
</html>
